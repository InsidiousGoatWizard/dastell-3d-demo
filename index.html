<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PIB ROCKS DEMO</title>

    <style>

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;

            background-image: black;

            font-family: Arial, sans-serif;
        }

        #viewer {
            position: absolute;

            left: 0;
            top: 0;

            background-image: linear-gradient(rgba(0, 0, 140, 0.5), rgba(0, 0, 0, 1));

            width: 100%;
            height: 100%;
        }

        #ui {
            position: absolute;

            left: 15px;
            top: 15px;

            z-index: 100;

            padding: 14px;

            background: rgba(25, 25, 25, 0.92);

            color: white;

            border-radius: 8px;

            box-shadow:
                0 4px 20px rgba(0, 0, 0, 0.4);
        }

        #codeInspector {
            position: absolute;

            left: 15px;

            z-index: 100;

            display: flex;
            flex-direction: column;

            padding: 14px;

            background: rgba(25, 25, 25, 0.92);

            color: white;

            border-radius: 8px;

            box-shadow:
                0 4px 20px rgba(0, 0, 0, 0.4);

            width: 300px;
            max-height: calc(100vh - 30px);
            box-sizing: border-box;
        }

        #codeInspector h2 {
            margin: 0 0 12px 0;

            font-size: 18px;
        }

        #codeInspector textarea {
            flex: 1;

            min-height: 180px;
            width: 100%;
            box-sizing: border-box;

            padding: 8px;

            resize: vertical;

            background: rgba(0, 0, 0, 0.25);
            border: 1px solid #666;
            border-radius: 4px;

            color: #ddd;

            font-family: 'Courier New', Courier, monospace;
            font-size: 12px;
            white-space: pre;
        }

        #codeInspector textarea:read-only {
            color: #888;
        }

        #codeInspector button {
            margin-top: 8px;

            padding: 6px 10px;

            background: #333;
            border: 1px solid #777;
            border-radius: 4px;

            color: white;

            cursor: pointer;
        }

        #codeInspector button:disabled {
            cursor: not-allowed;
            opacity: 0.5;
        }

        #codeInspector pre {
            margin: 0;

            overflow: auto;

            color: #ddd;

            font-family: 'Courier New', Courier, monospace;
            font-size: 12px;
            white-space: pre-wrap;
        }

        #ui h2 {
            margin: 0 0 12px 0;

            font-size: 18px;
        }

        #ui label {
            display: block;

            margin-top: 10px;
            margin-bottom: 4px;

            color: #bbb;
        }

        #ui input {
            width: 240px;
        }

        #executeCommand {
            background-color: rgba(0, 0, 0, 0);
            color: whitesmoke;
            border: whitesmoke solid 1px;
            border-radius: 5px;
            height: 1.5vw;
            width: 1.5vw;
        }

        #consoleInput {
            font-family: 'Courier New', Courier, monospace;
            background-color: inherit;
            border: 0;
            border-bottom: whitesmoke 1px solid;
            color: white;
            outline: none;
            box-shadow: none;
        }

        #consoleInput:focus {
            border: 0;
            border-bottom: whitesmoke 1px solid;
            outline: none;
            box-shadow: none;
        }

        #consoleOutput {
            padding-left: 0.5vw;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9vw;
        }

        #consoleOutput p {
            margin: 2px 0;
            cursor: pointer;
        }

        #modelInfo {
            margin-top: 10px;

            color: #aaa;

            font-size: 13px;

            max-width: 300px;
        }

        #cameraInfo {
            margin-top: 6px;

            color: #888;

            font-size: 12px;

            max-width: 300px;
        }

        #error {
            margin-top: 10px;

            color: #ff7070;

            max-width: 300px;

            white-space: pre-wrap;
        }

    </style>

</head>


<body>


<div id="ui">

    <h2>Dastell 3D PIB Rocks demo</h2>

    <p><button id="executeCommand">></button> <input type="text" name="consoleInput" id="consoleInput" placeholder="Give a command"></p>

    <input type="file" id="pythonFileInput" accept=".py,text/x-python" hidden>

    <div id="consoleOutput">
        Welcome to the online robotics demo of Dastell 3D!
        <hr>
        Type HELP for the full list of commands
    </div>
    
    <div id="modelInfo" hidden>
        No model loaded.
    </div>

    <div id="cameraInfo" hidden>
        Camera: 0, 0, 0
    </div>

    <div id="error"></div>

</div>


<div id="codeInspector">

    <h2 id="codeInspectorTitle">Latest Python file</h2>

    <textarea id="codeInspectorContent" readonly>No Python file has been run.</textarea>

    <button id="pushCodeModification" type="button" disabled>
        Push modification
    </button>

</div>


<div id="viewer"></div>


<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
    }
}
</script>


<script type="module" src="script.js"></script>

</body>
</html>
